services:
  postgres:
    image: postgres:16
    container_name: gamehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamehub
      POSTGRES_USER: gamehub
      POSTGRES_PASSWORD: gamehub123
    ports:
      - "5433:5432"
    volumes:
      - gamehub_pgdata:/var/lib/postgresql/data

volumes:
  gamehub_pgdata:
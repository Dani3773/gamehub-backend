server:
  port: 8080

spring:
  application:
    name: gamehub-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/gamehub
    username: gamehub
    password: gamehub123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # ddl-auto sempre "validate" -- quem cria/altera tabelas é o Flyway, nunca o Hibernate.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Configuração de JWT (usada quando a etapa de Security for implementada)
app:
  jwt:
    secret: troque-esta-chave-por-uma-bem-maior-e-guarde-em-variavel-de-ambiente
    expiration-ms: 86400000 # 24h
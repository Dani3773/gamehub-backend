<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | GameHub</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@900&family=Rajdhani:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body class="auth-bg"><main class="auth-wrap"><section class="auth-card"><a class="brand" href="/index.html">GAMEHUB</a><h1>Criar conta</h1><form id="form"><div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" required minlength="2" maxlength="120" autocomplete="name"></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required maxlength="160" autocomplete="email"></div><div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" required minlength="6" maxlength="100" autocomplete="new-password"></div><div id="error" class="error hidden" role="alert"></div><button class="button primary full" type="submit">Criar conta</button></form><p class="auth-link"><a href="/index.html">Já tem conta? Entrar</a></p></section></main><script type="module" src="/js/cadastro.js"></script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu perfil | GameHub</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@900&family=Rajdhani:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><a class="brand" href="/perfil.html">GAMEHUB</a><div class="nav-links"><a href="/jogos">Catálogo</a><a href="/compras">Minha biblioteca</a></div><a class="user-chip" href="/perfil.html"><span id="chipInitials" class="initials"></span><span id="chipName"></span></a><button id="logout" class="button">Sair</button></nav><main class="container"><h1>Meu perfil</h1><div class="grid profile-grid"><section class="card profile-card"><div id="avatar" class="avatar"></div><h2 id="profileName"></h2><p id="profileEmail" class="muted"></p><p><span id="profileRole" class="badge"></span></p><p><span class="muted">Membro desde</span><br><span id="memberSince"></span></p><p><span class="muted">Status</span><br><span id="status" class="status">Ativo</span></p></section><div class="grid"><section class="card"><h2>Dados da conta</h2><form id="form"><div class="field"><label for="nome">Nome</label><input id="nome" required minlength="2" maxlength="120"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" required maxlength="160"></div><div class="field"><label for="senha">Senha atualizada</label><input id="senha" type="password" required minlength="6" maxlength="100" autocomplete="new-password"><small class="muted">A API exige a senha para salvar as alterações.</small></div><div id="error" class="error hidden" role="alert"></div><div class="row"><button class="button primary" type="submit">Salvar alterações</button><button id="cancel" class="button" type="button">Cancelar</button></div></form></section><section class="card"><h2>Desativar conta</h2><p class=

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar usuários | GameHub</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@900&family=Rajdhani:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><div id="navbar"></div><main class="container"><div class="toolbar"><h1>Gerenciar usuários</h1><button id="newUser" class="button primary">Novo usuário</button></div><section class="card"><div class="toolbar"><label for="search">Buscar por nome ou e-mail</label><input id="search" type="search" placeholder="Nome ou e-mail"></div><div id="chips" class="chips"><button class="chip active" data-filter="all">Todos</button><button class="chip" data-filter="CLIENTE">Clientes</button><button class="chip" data-filter="ADMIN">Administradores</button><button class="chip" data-filter="inactive">Inativos</button></div><div id="error" class="error hidden" role="alert"></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Cadastro</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div><p id="count" class="footer"></p></section></main><div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="card modal"><h2 id="modalTitle">Novo usuário</h2><form id="userForm"><div class="field"><label for="nome">Nome</label><input id="nome" required minlength="2" maxlength="120"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" required maxlength="160"></div><div class="field"><label for="senha">Senha</label><input id="senha" type="password" required minlength="6" maxlength="100"><small id="passwordHint" class="muted"></small></div><div class="field"><label for="perfil">Perfil</label><select id="perfil"><option value="CLIENTE">CLIENTE</option><option value="ADMIN">ADMIN</option></select></div><div id="modalError" class="error hidden" role="alert"></div><div class="modal-actions"><button id="cancel" type="button" class="button">Cancelar</button><button class="button primary" type="submit">Salvar</button></div></form></section></div><script type="module" src="/js/usuarios.js"></script></body></html>

<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciar categorias | GameHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar"></div>
<main class="container">
    <h1>Gerenciar categorias</h1>
    <p id="erro-lista" class="error hidden" role="alert"></p>

    <section class="card">
        <h2 id="titulo-form">Nova categoria</h2>

        <form id="categoria-form">
            <div class="field">
                <label for="nome">Nome</label>
                <input id="nome" required maxlength="100">
            </div>

            <div class="field">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" maxlength="500"></textarea>
            </div>

            <p id="erro-form" class="error hidden" role="alert"></p>

            <button class="button primary" type="submit">Salvar</button>
            <button class="button hidden" id="cancelar" type="button">
                Cancelar edição
            </button>
        </form>
    </section>

    <section class="card" style="margin-top: 22px">
        <h2>Categorias cadastradas</h2>
        <p id="estado-lista" class="muted" role="status"></p>

        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Descrição</th>
                    <th scope="col">Ações</th>
                </tr>
                </thead>
                <tbody id="categorias"></tbody>
            </table>
        </div>
    </section>
</main>

<script type="module" src="/js/categorias.js"></script>
</body>
</html>
